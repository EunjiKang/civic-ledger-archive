name: Publish Civic Ledger Archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: civic-ledger-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Extract original publication package
        run: unzip -q Civic_Ledger_GitHub_v23.zip -d publication
      - name: Prepare public pages and sharing metadata
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 publication/tools/prepare_pages.py --base-url "$PAGES_BASE_URL" --output _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: publication/_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

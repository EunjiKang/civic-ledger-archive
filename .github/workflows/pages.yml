name: Publish Civic Ledger Archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: civic-ledger-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Extract original publication package
        run: unzip -q Civic_Ledger_GitHub_v23.zip -d publication
      - name: Prepare public pages and sharing metadata
        env:
          PAGES_BASE_URL: https://archive.civicledger.city
        run: python3 publication/tools/prepare_pages.py --base-url "$PAGES_BASE_URL" --output _site
      - name: Update bilingual article credits, search spacing and footer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          script = r'''(() => {
            const labels = {en: '🇬🇧 English', ko: '🇰🇷 한국어'};
            const articleCredits = {"en":[["credit-authors","Authors","<a class=\"person-profile-link\" href=\"https://www.linkedin.com/in/ahyoung-park-asum/\" target=\"_blank\" rel=\"noopener noreferrer\">Ahyoung Park</a> · <a class=\"person-profile-link\" href=\"https://www.linkedin.com/in/eunjikangsin/\" target=\"_blank\" rel=\"noopener noreferrer\">Eunji Kang</a>"],["credit-review","Review and feedback","With thanks to <a class=\"person-profile-link\" href=\"https://www.linkedin.com/in/fang-jui-chang/\" target=\"_blank\" rel=\"noopener noreferrer\">Fang-Jui Chang</a> and <a class=\"person-profile-link\" href=\"https://www.linkedin.com/in/cainechan/\" target=\"_blank\" rel=\"noopener noreferrer\">Caine Chan</a> for their thoughtful comments and for helping sharpen the ideas and arguments in this piece."],["credit-team","Project team","<a class=\"person-profile-link\" href=\"https://www.linkedin.com/in/eunjikangsin/\" target=\"_blank\" rel=\"noopener noreferrer\">Eunji Kang</a> (Mission Lead, Civic Systems), <a class=\"person-profile-link\" href=\"https://www.linkedin.com/in/icemilo/\" target=\"_blank\" rel=\"noopener noreferrer\">Jaeseung Koo</a> (CTO), <a class=\"person-profile-link\" href=\"https://www.linkedin.com/in/fang-jui-chang/\" target=\"_blank\" rel=\"noopener noreferrer\">Fang-Jui Chang</a> (Strategic Design Lead), Doeun Kim (FCA), Junghan Seo (Developer), Byungsang Park (Developer), <a class=\"person-profile-link\" href=\"https://www.linkedin.com/in/ahyoung-park-asum/\" target=\"_blank\" rel=\"noopener noreferrer\">Ahyoung Park</a> (Civic Strategy &amp; Research), Seongwon Song (Product Owner)"],["credit-project-note","Project note","<a class=\"person-profile-link\" href=\"https://civicledger.city/\" target=\"_blank\" rel=\"noopener noreferrer\">Civic Ledger</a> is currently being applied in Korea through <a class=\"person-profile-link\" href=\"https://www.wesharing.co.kr/\" target=\"_blank\" rel=\"noopener noreferrer\">WeSharing</a>, a platform for discovering, connecting, and using a city’s underused spaces and assets together. WeSharing is being developed and tested with local governments in Incheon, Daegu, Yongin, and Jeollanam-do, alongside regional industry promotion agencies: Incheon Technopark, the Jeonnam Information and Culture Industry Promotion Agency, the Yongin Industry Promotion Agency, and Daegu Technopark. This public–private collaboration is led by the National IT Industry Promotion Agency (NIPA), a Korean government agency supporting the digital industry. We welcome conversations with cities and organisations interested in developing this work further with us."]],"ko":[["credit-authors","저자","<a class=\"person-profile-link\" href=\"https://www.linkedin.com/in/ahyoung-park-asum/\" target=\"_blank\" rel=\"noopener noreferrer\">박아영</a> · <a class=\"person-profile-link\" href=\"https://www.linkedin.com/in/eunjikangsin/\" target=\"_blank\" rel=\"noopener noreferrer\">강은지</a>"],["credit-review","비판적 검토 및 피드백","<a class=\"person-profile-link\" href=\"https://www.linkedin.com/in/fang-jui-chang/\" target=\"_blank\" rel=\"noopener noreferrer\">Fang-Jui Chang</a> · <a class=\"person-profile-link\" href=\"https://www.linkedin.com/in/cainechan/\" target=\"_blank\" rel=\"noopener noreferrer\">Caine Chan</a>"],["credit-team","프로젝트팀","<a class=\"person-profile-link\" href=\"https://www.linkedin.com/in/eunjikangsin/\" target=\"_blank\" rel=\"noopener noreferrer\">강은지</a> (미션 총괄, 시빅 시스템), <a class=\"person-profile-link\" href=\"https://www.linkedin.com/in/icemilo/\" target=\"_blank\" rel=\"noopener noreferrer\">구재승</a> (CTO), <a class=\"person-profile-link\" href=\"https://www.linkedin.com/in/fang-jui-chang/\" target=\"_blank\" rel=\"noopener noreferrer\">Fang-Jui Chang</a> (전략 디자인 총괄), 김도은 (FCA), 서정한 (개발자), 박병상 (개발자), <a class=\"person-profile-link\" href=\"https://www.linkedin.com/in/ahyoung-park-asum/\" target=\"_blank\" rel=\"noopener noreferrer\">박아영</a> (시빅 전략 및 리서치), 송성원 (프로덕트 오너)"],["credit-project-note","프로젝트 소개","<a class=\"person-profile-link\" href=\"https://civicledger.city/\" target=\"_blank\" rel=\"noopener noreferrer\">Civic Ledger</a>는 현재 한국에서 <a class=\"person-profile-link\" href=\"https://www.wesharing.co.kr/\" target=\"_blank\" rel=\"noopener noreferrer\">위쉐어링(WeSharing)</a>을 통해 실제 도시 현장에 적용되고 있습니다. 위쉐어링은 도시의 유휴 공간과 자산을 함께 발견하고, 연결하고, 활용하는 플랫폼입니다. 위쉐어링은 인천, 대구, 용인, 전라남도의 지자체 및 인천테크노파크, 전남정보문화산업진흥원, 용인시산업진흥원, 대구테크노파크 등 지역 산업진흥기관과 함께 개발과 실증을 진행하고 있습니다. 이 민관 협력은 한국의 디지털 산업을 지원하는 정부 기관인 정보통신산업진흥원(NIPA)이 주관합니다. 이 작업을 함께 발전시켜 나갈 도시 및 기관과의 대화를 환영합니다."]]};
            function updateArticleCredits(korean) {
              const language = korean ? 'ko' : 'en';
              document.querySelectorAll('.final-credits').forEach(block => {
                if (block.dataset.creditsVersion === '20260928-' + language) return;
                const headingClass = block.querySelector('h3')?.className || '';
                block.innerHTML = articleCredits[language].map(([id, title, ...paragraphs]) =>
                  '<h3 id="' + id + '" data-read-key="' + id + '" data-heading-level="3">' + title + '</h3>' +
                  paragraphs.map((text, index) => '<p data-read-key="' + id + '-p' + index + '">' + text + '</p>').join('')
                ).join('');
                block.querySelectorAll('h3').forEach(heading => { heading.className = headingClass; });
                block.dataset.creditsVersion = '20260928-' + language;
              });
            }
            function updateLanguageDetails() {
              document.querySelectorAll('button[data-lang]').forEach(button => {
                const label = labels[button.dataset.lang];
                if (label && button.textContent !== label) button.textContent = label;
              });
              const koreanButton = document.querySelector('button[data-lang="ko"]');
              const korean = koreanButton ? koreanButton.getAttribute('aria-pressed') === 'true' : document.documentElement.lang.startsWith('ko');
              updateArticleCredits(korean);
              const team = document.getElementById('footer-contributors-title');
              const title = korean ? '프로젝트팀' : 'Project team';
              if (team && team.textContent !== title) team.textContent = title;
              const preview = team?.parentElement.querySelector('.contributor-preview');
              if (preview) {
                const members = Array.from(preview.children);
                const fang = members.find(node => node.textContent.trim() === 'Fang-Jui Chang');
                const doeun = members.find(node => ['Doeun Kim', '김도은'].includes(node.textContent.trim()));
                if (fang && doeun && members.indexOf(fang) > members.indexOf(doeun)) {
                  const separator = fang.nextElementSibling;
                  preview.insertBefore(fang, doeun);
                  if (separator?.getAttribute('aria-hidden') === 'true') preview.insertBefore(separator, doeun);
                }
              }
              const target = korean ? 'https://kr.darkmatterlabs.org/' : 'https://darkmatterlabs.org/';
              document.querySelectorAll('#tools-apps a').forEach(link => {
                if (['https://kr.darkmatterlabs.org/', 'https://darkmatterlabs.org/'].includes(link.getAttribute('href')) && link.getAttribute('href') !== target) link.setAttribute('href', target);
              });
            }
            updateLanguageDetails();
            new MutationObserver(updateLanguageDetails).observe(document.body, {
              childList:true, subtree:true, attributes:true, attributeFilter:['aria-pressed','lang']
            });
          })();'''
          subprocess.run(['node', '--check'], input=script, text=True, check=True)
          assert Path('publication/_site/index.html').is_file()
          marker = 'civic-language-footer-update'
          for page in Path('publication/_site').rglob('*.html'):
              content = page.read_text(encoding='utf-8')
              if marker in content:
                  continue
              if '</body>' not in content:
                  continue
              content = content.replace('</head>', '<style id="civic-search-spacing">' + "html[lang=\"ko\"] #main-content .civic-search.writing-search, html[lang=\"ko\"] #main-content .civic-search.archive-search { margin-bottom: 12px; } #cl-discussion .cl-aside > p { margin: 16px 0 0; } #tools-apps .contact-meeting h3 { font-size: 19px; font-weight: 600; font-style: normal; line-height: 1.4; letter-spacing: -.03em; margin: 6px 0 8px; } #tools-apps .footer-contact .contact-meeting > p, html[lang=ko] #tools-apps .footer-contact .contact-meeting > p { font-size: 13px !important; font-weight: 400; font-style: normal; line-height: 1.75 !important; letter-spacing: normal; margin: 0 0 10px; } html[lang=ko] #tools-apps .contact-meeting h3, html[lang=ko] #tools-apps .contact-meeting > p { letter-spacing: -.01em; }" + ' html[lang=ko] #tools-apps .footer-contact .contact-meeting > p { max-width: none; }' + ' #article-panel #article-content .final-credits > h3 { margin-bottom: 4px !important; } #article-panel #article-content .final-credits > h3 + p { margin-top: 0 !important; }' + '</style></head>')
              content = content.replace('</body>', '<script id="' + marker + '">' + script + '</script>\n</body>')
              page.write_text(content, encoding='utf-8')
          PY
      - name: Prepare complete downloadable package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil, hashlib, os
          root = Path('release-package')
          site = Path('publication/_site')
          index = (site / 'index.html').read_text(encoding='utf-8')
          for marker in ['비판적 검토 및 피드백', '프로젝트팀', 'Project team', 'Strategic Design Lead', '전략 디자인 총괄', 'margin-bottom: 4px']:
              assert marker in index, marker
          assert (site / 'assets').is_dir()
          shutil.copytree(site, root / 'website')
          source = root / 'source'
          (source / '.github/workflows').mkdir(parents=True)
          shutil.copy2('Civic_Ledger_GitHub_v23.zip', source)
          shutil.copy2('.github/workflows/pages.yml', source / '.github/workflows/pages.yml')
          readme = '''Civic Ledger — Complete package — 2026-09-28

          website/: Ready-to-publish website with all current changes, images, diagrams and downloadable PDFs. Publish the CONTENTS of this folder as the web root.

          source/: Original publication package plus the current GitHub Actions workflow. The workflow applies all subsequent updates and recreates the website. The original ZIP alone does not contain the latest updates; retain the workflow with it.

          Included updates: bilingual article credits; Korean critical review names; Project team labels; single-paragraph project notes; compact credit-heading spacing; search-line spacing; language flags and footer links; reading-note spacing; matching Contact typography and full-width Korean meeting description. All earlier site assets and changes are retained.

          To preview, use a local web server or static hosting. Do not rely on opening index.html as a file URL.
          '''
          (root / 'README.txt').write_text(readme, encoding='utf-8')
          (root / 'BUILD_COMMIT.txt').write_text(os.environ['GITHUB_SHA'] + '\n', encoding='utf-8')
          manifest = []
          for file in sorted(root.rglob('*')):
              if file.is_file():
                  digest = hashlib.sha256(file.read_bytes()).hexdigest()
                  manifest.append(digest + '  ' + file.relative_to(root).as_posix())
          (root / 'SHA256SUMS.txt').write_text('\n'.join(manifest) + '\n', encoding='utf-8')
          print('Packaged', len(manifest), 'files')
          PY
      - name: Upload complete website package
        uses: actions/upload-artifact@v4
        with:
          name: Civic_Ledger_Full_Package_2026-09-28
          path: release-package/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-pages-artifact@v4
        with:
          path: publication/_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
